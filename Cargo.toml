[workspace]
members = [
    "crates/monomouse-core",
    "crates/monomouse-net",
    "crates/monomouse-input",
    "crates/monomouse-server",
    "crates/monomouse-client",
    "crates/monomouse-gui",
    "crates/monomouse-clipboard",
    "crates/monomouse-discovery",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rickyvaughn2/monomouse"
description = "Share a single mouse and keyboard across multiple machines with per-monitor grid awareness"

[workspace.dependencies]
monomouse-core = { path = "crates/monomouse-core" }
monomouse-net = { path = "crates/monomouse-net" }
monomouse-input = { path = "crates/monomouse-input" }
monomouse-clipboard = { path = "crates/monomouse-clipboard" }
monomouse-discovery = { path = "crates/monomouse-discovery" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
